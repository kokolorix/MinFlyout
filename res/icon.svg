<?xml version="1.0" encoding="UTF-8"?>
<!--
  MinFlyout - application icon (editable source)

  Motif: the minimize stroke, with the unfolding flyout below it.
  This file is the template for the large size; the actual minflyout.ico is
  generated by tools/build_icon.py, which draws a simplified geometry for
  16-32 px (two instead of three rows, snapped to whole pixels). Whoever
  changes the motif has to adjust both.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect x="0" y="0" width="256" height="256" rx="56" fill="url(#tile)"/>

  <!-- minimize stroke -->
  <rect x="76.8" y="60.2" width="102.4" height="15.4" rx="7.7" fill="#FFFFFF"/>

  <!-- Flyout -->
  <rect x="43.5" y="107.5" width="169" height="105" rx="17.9" fill="#FFFFFF"/>

  <!-- items -->
  <rect x="64" y="129.3" width="128"   height="14.1" rx="6.9" fill="#1D4ED8"/>
  <rect x="64" y="158.7" width="104.9" height="14.1" rx="6.9" fill="#1D4ED8"/>
  <rect x="64" y="188.2" width="117.8" height="14.1" rx="6.9" fill="#1D4ED8"/>
</svg>
